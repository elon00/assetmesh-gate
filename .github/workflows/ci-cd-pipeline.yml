name: CI / Python fail-closed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python tests (fail closed)
        run: python -m compileall -q tests
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Execute tests (not a security certification)
        run: python -m pytest -q tests
